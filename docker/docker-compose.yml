version: '3.8'

services:
  mcp2p-desktop:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mcp2p_app
    ports:
      - "42424:42424"
    volumes:
      - ..:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=${DISPLAY:-:0}
    restart: unless-stopped
