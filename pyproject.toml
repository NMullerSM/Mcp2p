[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp2p"
version = "2.0.1"
description = "Local-first P2P multi-agent collaboration platform powered by MCP & PyWebView"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "NMullerSM" }
]
dependencies = [
    "pywebview>=5.0.0",
    # El código usa la API 2.x (mcp.server.mcpserver.MCPServer); 1.x no la tiene y 3.x no está validada (Gate 0d).
    "mcp>=2.3,<3",
    # Importado directamente por src/mcp/server.py para el bind explícito de streamable-http.
    "uvicorn>=0.31.1",
    # Importado directamente por src/mcp/stdio_proxy.py (cliente HTTP del proxy stdio -> Hub); mcp 2.x ya lo exige.
    "httpx2>=2.10.0",
    "msgpack>=1.0.8",
    "cbor2>=5.6.0",
    "cryptography>=42.0.0",
    "PyYAML>=6.0.0",
    "certifi>=2024.0.0",
    "aiortc>=1.9.0",
    "websockets>=12.0",
    # Métricas y ciclo de vida de procesos PTY (Swarm Terminal Matrix V2 / EGM-63).
    "psutil>=5.9.0",
    # Espacio de nombres .NET `System` (system_projects_ui.py, barra de título en Windows); pywebview ya lo arrastra en win32.
    "pythonnet>=3.0; sys_platform == 'win32'",
    # Terminales integradas en Windows: ConPTY a traves de pywinpty (src/adapters/terminal/winpty_host.py).
    # >=3.1.2 fija winpty-rs 1.0.8 (entrecomilla argv[0] con espacios) y descarta las wheels rotas de 3.0.4.
    "pywinpty>=3.1.2; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]
build = [
    "pyinstaller>=6.0.0",
    "pillow>=10.0.0",
    "typer>=0.9.0"
]

[project.scripts]
mcp2p = "src.app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
# Catalogo versionado de CLIs de agente (src/adapters/terminal/cli_catalog.py lo lee en runtime).
"src.adapters.terminal" = ["cli_catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "connector_available: la plataforma Windows simulada SI tiene conector ConPTY (doble de pywinpty)",
    "conpty: pruebas reales de ConPTY/pywinpty (solo Windows; `pytest -m conpty -v -rA`)",
]
