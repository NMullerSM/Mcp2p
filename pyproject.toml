[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp2p"
version = "1.1.0"
description = "Local-first P2P multi-agent collaboration platform powered by MCP & PyWebView"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "NMullerSM" }
]
dependencies = [
    "pywebview>=5.0.0",
    "mcp>=1.0.0",
    "msgpack>=1.0.8",
    "cbor2>=5.6.0",
    "cryptography>=42.0.0",
    "PyYAML>=6.0.0",
    "certifi>=2024.0.0",
    "aiortc>=1.9.0",
    "websockets>=12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0"
]
build = [
    "pyinstaller>=6.0.0",
    "pillow>=10.0.0",
    "typer>=0.9.0"
]

[project.scripts]
mcp2p = "src.app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
